name: Nightly flasher (GitHub Pages)

# Builds our four boards from the firmware fork and publishes them, together with
# the flasher itself, to GitHub Pages. The site is replaced on every run.

on:
  schedule:
    - cron: 0 8 * * *
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nightly-pages
  cancel-in-progress: true

env:
  FIRMWARE_REPO: Ixitxachitl/meshtastic-firmware
  FIRMWARE_REF: native-windows-tft-maps-swipe

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      long: ${{ steps.v.outputs.long }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ env.FIRMWARE_REF }}
      - id: v
        env:
          BUILD_LOCATION: local
        run: |
          echo "long=$(./bin/buildinfo.py long)" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { env: t-deck, platform: esp32s3 }
          - { env: thinknode_m9, platform: esp32s3 }
          - { env: t-watch-ultra, platform: esp32s3 }
          - { env: seeed-sensecap-indicator, platform: esp32s3 }
          - { env: heltec-mesh-node-t1, platform: nrf52840 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ needs.version.outputs.sha }}
          submodules: recursive

      # ESP32-S3 on the 2026-10-09 build image, by digest: from 2026-10-10 the image fails every ESP32-S3 build,
      # upstream's own included (No module named 'SCons.Tool.FortranCommon'). The same run the action does; back to
      # the action once meshtastic/gh-action-firmware's image is fixed.
      - name: Build (pinned image)
        if: matrix.platform == 'esp32s3'
        env:
          MT_IMAGE: ghcr.io/meshtastic/gh-action-firmware@sha256:467a2c25275d5f43213e28a04ad0924a27d1e1ac625dc16e50ef919666d82b4d
        run: |
          docker pull --quiet "$MT_IMAGE"
          docker run --rm -e GITHUB_ACTIONS -e PLATFORMIO_BUILD_DIR=/workspace/.pio/build \
            -e MT_ENV=${{ matrix.env }} -e MT_PLATFORM=${{ matrix.platform }} -e MT_TARGET=build -e MT_VERBOSE=0 \
            -v "$GITHUB_WORKSPACE:/workspace" "$MT_IMAGE"

      # Upstream's build container for the platform runs bin/build-nrf52.sh.
      - uses: meshtastic/gh-action-firmware@main
        if: matrix.platform != 'esp32s3'
        with:
          pio_platform: ${{ matrix.platform }}
          pio_env: ${{ matrix.env }}
          pio_target: build

      # The container writes as root.
      - run: sudo chown -R "$(id -u):$(id -g)" release

      # Same as upstream build_firmware.yml: the unified OTA loader goes in app1.
      - name: Add unified OTA image to manifest
        if: matrix.platform == 'esp32s3'
        working-directory: release
        run: |
          OTA_FILE=mt-esp32s3-ota.bin
          curl -fsSL -o "$OTA_FILE" https://github.com/meshtastic/esp32-unified-ota/releases/latest/download/$OTA_FILE
          OTA_MD5=$(md5sum "$OTA_FILE" | cut -d' ' -f1)
          OTA_SIZE=$(stat -c%s "$OTA_FILE")
          for manifest in firmware-*.mt.json; do
            jq --arg name "$OTA_FILE" --arg md5 "$OTA_MD5" --argjson bytes "$OTA_SIZE" --arg part app1 \
              'if .files | map(select(.name == $name)) | length == 0 then .files += [{"name": $name, "md5": $md5, "bytes": $bytes, "part_name": $part}] else . end' \
              "$manifest" > "$manifest.tmp" && mv "$manifest.tmp" "$manifest"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.env }}
          # firmware-* only: the nRF52 build also copies helper UF2s (the erase image) into release/.
          path: |
            release/firmware-*.mt.json
            release/firmware-*.bin
            release/littlefs-*.bin
            release/mt-*.bin
            release/firmware-*.uf2
            release/firmware-*.hex
            release/firmware-*.zip

  # The Indicator's RP2040 co-processor firmware, built the way that repo's own CI builds it.
  indicator-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ixitxachitl/indicator_rp2040
          ref: beep-tones
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-indicator-rp2040-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-indicator-rp2040-

      - run: pip install --upgrade https://github.com/pioarduino/platformio-core/archive/487a894a713d36acbd9d858267076d0ab957d543.zip

      - run: pio run -e seeed_indicator_rp2040

      - run: mkdir -p out && cp .pio/build/seeed_indicator_rp2040/firmware.uf2 out/indicator-rp2040.uf2

      - uses: actions/upload-artifact@v4
        with:
          name: companion-indicator-rp2040
          path: out/indicator-rp2040.uf2

  deploy:
    needs: [version, build, indicator-companion]
    # A failed companion build only leaves its download out; the boards still publish.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Site URL and path follow the repo's Pages settings (custom domain or github.io subpath).
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build flasher
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          NIGHTLY_BASE: ${{ steps.pages.outputs.base_path }}/firmware # same-origin path, no scheme
        run: pnpm generate

      - uses: actions/download-artifact@v4
        with:
          pattern: fw-*
          merge-multiple: true
          path: .output/public/firmware

      - uses: actions/download-artifact@v4
        if: needs.indicator-companion.result == 'success'
        with:
          name: companion-indicator-rp2040
          path: .output/public/firmware

      - name: Write nightly index and release manifest
        working-directory: .output/public/firmware
        env:
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          ls firmware-*.bin > /dev/null # fail closed on an empty publish
          # Version as stamped by the build itself, so index.json always matches the file names.
          VER=$(ls firmware-t-deck-*.mt.json | sed -E 's/^firmware-t-deck-(.*)\.mt\.json$/\1/')
          echo "Publishing $VER"
          jq -n --arg ver "$VER" '{version: $ver, targets: [
            {board: "t-deck", platform: "esp32s3"},
            {board: "thinknode_m9", platform: "esp32s3"},
            {board: "t-watch-ultra", platform: "esp32s3"},
            {board: "seeed-sensecap-indicator", platform: "esp32s3"},
            {board: "heltec-mesh-node-t1", platform: "nrf52840"}
          ]}' > "firmware-$VER.json"
          jq -n --arg ver "$VER" --arg sha "$SHA" \
            '{version: $ver, id: ("v" + $ver), title: ("Meshtastic Firmware " + $ver + " Nightly"), commit: $sha}' > index.json
          printf '# Nightly %s\n\nBuilt from %s@%s\n' "$VER" "$FIRMWARE_REPO" "$SHA" > release_notes.md
          touch ../.nojekyll
          ls -l

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - id: deployment
        uses: actions/deploy-pages@v4
